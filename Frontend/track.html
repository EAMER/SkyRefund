<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Track Refund</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<section class="track-page">

    <div class="track-card">

        <div class="logo-containers">
            <img class="logo" src="Images/sage.webp" alt="">
            <h2 class="airport-refunds">Airline Refund</h2>
        </div>

        <h1>Track Your Refund</h1>

        <p>
            Enter your refund reference number below.
        </p>

        <input
            type="text"
            placeholder="REF-2026-123456">

        <button>
            Track Refund
        </button>

        <div class="tracking-result">

            <h3>Refund Information</h3>

            <p>
                <strong>Reference:</strong>
                REF-2026-482947
            </p>

            <p>
                <strong>Status:</strong>
                Pending Review
            </p>

            <p>
                <strong>Estimated Completion:</strong>
                7-14 Business Days
            </p>

        </div>

    </div>

</section>

</body>
</html>
